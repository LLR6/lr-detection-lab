[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-detection-lab"
version = "0.1.0"
description = "Reproducible beacon interval threshold experiments with evidence and false-positive counts"
requires-python = ">=3.10"

[project.scripts]
detection-lab = "detection_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
