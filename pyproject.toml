[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-detection-lab"
version = "0.2.0"
description = "Reproducible beacon interval threshold experiments with evidence and false-positive counts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "LLR6"}]
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
keywords = ["security", "blue-team", "detection-engineering", "benchmark", "reproducibility"]

[project.scripts]
detection-lab = "detection_lab.cli:main"

[project.urls]
Homepage = "https://github.com/LLR6/lr-detection-lab"
Repository = "https://github.com/LLR6/lr-detection-lab"
Issues = "https://github.com/LLR6/lr-detection-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]
