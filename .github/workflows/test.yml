name: Test
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Check release metadata consistency
        run: python scripts/check_release_metadata.py
      - name: Check local documentation links
        run: python scripts/check_local_links.py
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Compile package
        run: python -m compileall -q src/detection_lab
      - name: Smoke-test installed CLI
        run: detection-lab --help > /dev/null
      - run: python -m pip install "jsonschema>=4.23"
      - name: CLI version smoke test
        run: detection-lab --version
      - run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q src
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Validate JSON Schemas
        shell: bash
        run: |
          if compgen -G "schemas/*.json" > /dev/null; then
            for f in schemas/*.json; do python -m json.tool "$f" > /dev/null; done
          fi
      - name: Coverage snapshot
        run: |
          python -m pip install "coverage>=7.6"
          coverage run --source=src/detection_lab -m unittest discover -s tests -v
          coverage report -m --fail-under=50
          coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: lr-detection-lab-coverage-${{ matrix.python-version }}
          path: coverage.xml
      - name: Run multi-seed stability experiment
        run: detection-lab replicate --seeds 1,2,3,4,5 --groups 20 --samples 12 --thresholds 0.05,0.1,0.2,0.3,0.5 --output replicate-report.json
      - name: Validate replicate-report schema
        run: python scripts/validate_json_schema.py schemas/replicate-report.schema.json replicate-report.json
      - name: Hash replicate report
        run: sha256sum replicate-report.json > replicate-report.json.sha256
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/lr-wheel-smoke
          /tmp/lr-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/lr-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/lr-wheel-smoke/bin/detection-lab --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detection-lab-replicate-${{ matrix.python-version }}
          path: |
            replicate-report.json
            replicate-report.json.sha256
