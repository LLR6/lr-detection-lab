name: Test
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Run multi-seed stability experiment
        run: detection-lab replicate --seeds 1,2,3,4,5 --groups 20 --samples 12 --thresholds 0.05,0.1,0.2,0.3,0.5 --output replicate-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detection-lab-replicate-${{ matrix.python-version }}
          path: replicate-report.json
